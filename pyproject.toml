[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flapsim"
version = "0.1.0"
description = "Object-oriented MuJoCo simulation for flapping-wing robots"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.8",
  "numpy>=1.24"
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flapsim*"]

[tool.setuptools.package-data]
flapsim = [
  "config/*.json",
  "robot/SingleThrustFlapper/urdf/*.urdf",
  "robot/SingleThrustFlapper/meshes/*.STL"
]

[tool.pytest.ini_options]
pythonpath = ["."]
