[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flapsim"
version = "0.2.0"
description = "Open simulation platform for flapping-wing robots on MuJoCo: import a robot, declare its wings, plug in aerodynamics"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "Mingshan He"}]
keywords = ["mujoco", "flapping-wing", "aerodynamics", "robotics", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=1.24",
  "pyyaml>=6.0"
]

[project.scripts]
flapsim = "flapsim.cli:main"

[project.entry-points."flapsim.plugins"]
builtin = "flapsim.plugins.builtin"

[project.urls]
Homepage = "https://github.com/MingshanHe/FlapSim"
Issues = "https://github.com/MingshanHe/FlapSim/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.5"]
video = ["imageio[ffmpeg]>=2.34", "Pillow>=10"]
hdf5 = ["h5py>=3.10"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pymdown-extensions>=10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flapsim*"]

[tool.setuptools.package-data]
flapsim = [
  "config/*.json",
  "assets/robots/*/*.yaml",
  "assets/robots/*/*.json",
  "assets/robots/*/urdf/*.urdf",
  "assets/robots/*/meshes/*.STL"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["examples/notebooks", "*.md"]  # docs code samples stay compact

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"flapsim/config/*.py" = ["N"]
