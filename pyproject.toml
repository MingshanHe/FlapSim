[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flapsim"
version = "1.0.0"
description = "Object-oriented MuJoCo simulation for flapping-wing robots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.8",
  "numpy>=1.24"
]

[project.optional-dependencies]
test = ["pytest>=8"]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
mjx = ["mujoco-mjx>=3.8", "jax>=0.6"]
gpu = ["mujoco-mjx>=3.8", "jax[cuda12]>=0.6; platform_system == 'Linux'"]
model = ["trimesh>=4"]
rl = ["gymnasium>=0.29,<2", "stable-baselines3>=2.4,<3", "matplotlib>=3.7"]

[project.scripts]
flapsim = "flapsim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flapsim*"]
namespaces = false

[tool.setuptools.package-data]
flapsim = [
  "config/robots/*.json",
  "config/training/*.json",
  "rl/*.md",
  "rl/*.cpp",
  "robot/IST_robot/*.py",
  "robot/IST_robot/*.md",
  "robot/IST_robot/*.json",
  "robot/IST_robot-V2/*.py",
  "robot/IST_robot-V2/*.md",
  "robot/*/urdf/*.urdf",
  "robot/*/urdf/*.xml",
  "robot/*/meshes/*.STL",
  "robot/*/meshes/*.stl"
]
