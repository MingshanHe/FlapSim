# The `NEAT` section specifies parameters particular to the NEAT algorithm
# or the experiment itself.  This is the only required section.
[NEAT]
fitness_criterion      = max
fitness_threshold      = 3.5
no_fitness_termination = True
pop_size               = 96
reset_on_extinction    = True
seed                   = None

[HistoryGenome]
initial_connection      = full_direct
activation_default                 = tanh
activation_mutate_rate             = 0.08
activation_options                 = tanh bipolar_sigmoid softsign sin gauss clamped
aggregation_default                = sum
aggregation_mutate_rate            = 0.0
aggregation_options                = sum
bias_init_mean                     = 0.0
bias_init_stdev                    = 0.05
bias_init_type                     = gaussian
bias_max_value                     = 3.0
bias_min_value                     = -3.0
bias_mutate_power                  = 0.025
bias_mutate_rate                   = 0.3
bias_replace_rate                  = 0.005
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5
conn_add_prob                      = 0.15
conn_delete_prob                   = 0.01
enabled_default                    = True
enabled_mutate_rate                = 0.005
enabled_rate_to_false_add          = 0.0
enabled_rate_to_true_add           = 0.0
feed_forward                       = False
node_add_prob                      = 0.06
node_delete_prob                   = 0.01
num_hidden                         = 12
num_inputs                         = 15
num_outputs                        = 3
response_init_mean                 = 1.0
response_init_stdev                = 0.0
response_init_type                 = gaussian
response_max_value                 = 1.0
response_min_value                 = 1.0
response_mutate_power              = 0.0
response_mutate_rate               = 0.0
response_replace_rate              = 0.0
single_structural_mutation         = True
structural_mutation_surer          = default
time_constant_init_mean            = 1.0
time_constant_init_stdev           = 0.0
time_constant_init_type            = gaussian
time_constant_max_value            = 10.0
time_constant_min_value            = 0.01
time_constant_mutate_power         = 0.0
time_constant_mutate_rate          = 0.0
time_constant_replace_rate         = 0.0
weight_init_mean                   = 0.0
weight_init_stdev                  = 0.25
weight_init_type                   = gaussian
weight_max_value                   = 5.0
weight_min_value                   = -5.0
weight_mutate_power                = 0.09
weight_mutate_rate                 = 0.5
weight_replace_rate                = 0.005

[BoundedSpeciesSet]
compatibility_threshold = 0.8

[DefaultStagnation]
max_stagnation       = 12
species_elitism      = 2
species_fitness_func = max

[DefaultReproduction]
elitism            = 2
min_species_size   = 2
survival_threshold = 0.25
