<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .label { font-family: sans-serif; font-size: 18px; fill: #111827; }
      .small { font-family: sans-serif; font-size: 15px; fill: #374151; }
      .math { font-family: serif; font-size: 19px; font-style: italic; fill: #111827; }
      .box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1100" height="560" fill="white"/>
  <text x="35" y="42" class="title">Coordinate-frame relation</text>

  <!-- Left panel: frame transforms -->
  <rect x="30" y="65" width="470" height="450" class="box"/>
  <text x="55" y="100" class="label">Frame transformation</text>

  <rect x="175" y="125" width="180" height="64" class="box"/>
  <text x="205" y="153" class="math">{W}</text>
  <text x="205" y="177" class="small">world frame</text>

  <rect x="70" y="260" width="180" height="64" class="box"/>
  <text x="100" y="288" class="math">{B}</text>
  <text x="100" y="312" class="small">body frame</text>

  <rect x="285" y="390" width="180" height="74" class="box"/>
  <text x="315" y="418" class="math">{Aₖ}</text>
  <text x="315" y="442" class="small">wing aero frame</text>

  <line x1="165" y1="260" x2="235" y2="190" stroke="#2563eb" stroke-width="3"/>
  <polygon points="235,190 222,195 230,205" fill="#2563eb"/>
  <text x="78" y="215" class="math">R_WB</text>

  <line x1="300" y1="390" x2="220" y2="325" stroke="#059669" stroke-width="3"/>
  <polygon points="220,325 233,328 225,339" fill="#059669"/>
  <text x="225" y="365" class="math">R_BA,k</text>

  <line x1="405" y1="390" x2="330" y2="190" stroke="#dc2626" stroke-width="3"/>
  <polygon points="330,190 340,202 326,205" fill="#dc2626"/>
  <text x="375" y="280" class="math">R_WA,k</text>

  <text x="58" y="490" class="math">R_WA,k = R_WB R_BA,k</text>

  <!-- Right panel: aerodynamic frame -->
  <rect x="530" y="65" width="540" height="450" class="box"/>
  <text x="555" y="100" class="label">Aerodynamic frame on one wing</text>

  <!-- Wing planform in y-z plane -->
  <polygon points="690,255 990,255 930,395 690,395"
           fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="815" y="330" class="label">wing plane: y_A-z_A</text>
  <circle cx="690" cy="255" r="6" fill="#111827"/>
  <text x="620" y="240" class="small">origin O_A</text>

  <!-- +y span -->
  <line x1="690" y1="255" x2="990" y2="255" stroke="#059669" stroke-width="4"/>
  <polygon points="990,255 976,247 976,263" fill="#059669"/>
  <text x="840" y="235" class="math">+y_A : span / feathering axis</text>

  <!-- -z chord -->
  <line x1="690" y1="255" x2="690" y2="420" stroke="#2563eb" stroke-width="4"/>
  <polygon points="690,420 682,406 698,406" fill="#2563eb"/>
  <text x="705" y="420" class="math">-z_A : chordwise CoP direction</text>

  <!-- +x normal and Fn, shown diagonal to indicate out of plane -->
  <line x1="690" y1="255" x2="610" y2="155" stroke="#dc2626" stroke-width="5"/>
  <polygon points="610,155 624,159 614,171" fill="#dc2626"/>
  <text x="550" y="140" class="math">+x_A : wing normal</text>
  <text x="555" y="170" class="math">F_N acts here</text>

  <!-- CoP -->
  <circle cx="865" cy="340" r="8" fill="#7c3aed"/>
  <text x="878" y="365" class="math">CoP = [0, sₖ r_cp, -c_cp]ᵀ</text>

  <text x="555" y="485" class="math">F_A = [F_N, 0, 0]ᵀ because F_N ∥ +x_A</text>
</svg>
